<!doctype html>
<html lang="tr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Nemrova — Yakında Hizmetinizde</title>

    <!-- Basit, modern yazı tipi -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">

    <style>
        :root{
            --bg1: #0f172a;
            --bg2: #071032;
            --accent: #7c5cff;
            --muted: #9aa4bf;
        }
        *{box-sizing:border-box}
        html,body{height:100%;}
        body{
            margin:0;
            font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
            background: linear-gradient(135deg,var(--bg1),var(--bg2));
            color:#fff;
            display:flex;
            align-items:center;
            justify-content:center;
            padding:24px;
        }

        .card{
            width:100%;
            max-width:920px;
            background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.02));
            border-radius:16px;
            padding:32px;
            box-shadow: 0 10px 30px rgba(2,6,23,0.6);
            grid-template-columns: 1fr 360px;
            gap:24px;
            align-items:center;
        }

        .brand{
            display:flex;
            gap:16px;
            align-items:center;
        }
        .logo{
            width:64px;
            height:64px;
            border-radius:12px;
            background: linear-gradient(135deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
            display:flex;
            align-items:center;
            justify-content:center;
            font-weight:700;
            color:var(--accent);
            font-size:20px;
            box-shadow: inset 0 -6px 16px rgba(0,0,0,0.4);
        }
        h1{
            margin:12px 0 6px;
            font-size:28px;
            line-height:1.05;
        }
        p.lead{margin:0;color:var(--muted)}

        .right{
            justify-self:end;
            text-align:left;
        }

        .cta{
            margin-top:18px;
            display:flex;
            gap:8px;
        }
        input[type="email"]{
            flex:1;
            padding:12px 14px;
            border-radius:10px;
            border:1px solid rgba(255,255,255,0.06);
            background:transparent;
            color:#fff;
            outline:none;
            font-size:14px;
        }
        button{
            padding:12px 16px;
            border-radius:10px;
            border:0;
            background: linear-gradient(90deg,var(--accent), #5ba6ff);
            color:#fff;
            font-weight:600;
            cursor:pointer;
            min-width:120px;
        }
        .meta{margin-top:14px;color:var(--muted);font-size:13px}
        .social{margin-top:16px;display:flex;gap:10px}
        .pill{padding:8px 10px;border-radius:999px;background:rgba(255,255,255,0.02);font-size:13px;color:var(--muted)}

        /* Responsive */
        @media (max-width:800px){
            .card{grid-template-columns:1fr; text-align:center; padding:24px}
            .right{justify-self:center}
            .social{justify-content:center}
        }

        /* subtle animation */
        .logo{animation:float 4s ease-in-out infinite}
        @keyframes float{
            0%{transform:translateY(0)}
            50%{transform:translateY(-6px)}
            100%{transform:translateY(0)}
        }

        .thank {
            display:none;
            margin-top:12px;
            color:#bff1c3;
            font-weight:600;
        }
    </style>
</head>
<body>
<main class="card" role="main">
    <section style="margin: 0 auto">
        <h1>
            <div class="logo" aria-hidden="true" style="float: left;">N</div>
            <div style="padding-top: 15px; margin-left: 80px">Nemrova <span style="color:var(--accent)">yakında</span> hizmetinizde.</div>
        </h1>
    </section>




</main>

<script>
    // Basit "abonelik" davranışı (gerçek backend yok)
    const btn = document.getElementById('sendBtn');
    const emailInput = document.getElementById('email');
    const thanks = document.getElementById('thanks');

    btn.addEventListener('click', () => {
        const email = emailInput.value.trim();
        if(!email || !email.includes('@')) {
            emailInput.focus();
            emailInput.setAttribute('placeholder','Lütfen geçerli bir e-posta girin');
            return;
        }

        // görsel geri bildirim
        btn.disabled = true;
        btn.textContent = "Gönderildi ✓";
        thanks.style.display = 'block';

        // (Opsiyonel) burada fetch() ile kendi API'ine gönderim yapabilirsin.
        // setTimeout ile butonu tekrar açıyoruz — sadece demo
        setTimeout(() => {
            btn.disabled = false;
            btn.textContent = "Beni Haber Ver";
        }, 4000);
    });

    // Enter ile de gönderilsin
    emailInput.addEventListener('keydown', (e) => {
        if(e.key === 'Enter') btn.click();
    });
</script>
</body>
</html>
